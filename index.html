<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LabCalc">
  <meta name="theme-color" content="#0c0a09">
  <title>LabCalc</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .lc-app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #0c0a09;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      color: #e7e5e4;
      -webkit-font-smoothing: antialiased;
    }

    .lc-header {
      background: #1c1917;
      padding: 14px 20px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      border-bottom: 2px solid #22c55e;
    }
    .lc-header-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #22c55e;
    }
    .lc-header-title {
      font-size: 19px;
      font-weight: 700;
      color: #fafaf9;
      letter-spacing: -0.04em;
    }

    .lc-nav {
      background: #1c1917;
      border-bottom: 1px solid #292524;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }
    .lc-tab {
      flex: 1;
      padding: 12px 2px;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 500;
      color: #57534e;
      font-family: inherit;
      text-align: center;
      transition: color 0.12s;
      letter-spacing: -0.01em;
    }
    .lc-tab:hover { color: #a8a29e; }
    .lc-tab-active {
      color: #4ade80 !important;
      font-weight: 600;
      border-bottom-color: #22c55e;
    }
    .lc-tab-short { display: none; }

    @media (max-width: 520px) {
      .lc-tab-full { display: none; }
      .lc-tab-short { display: inline; }
      .lc-tab { font-size: 12px; }
      .lc-nav { padding: 0 4px; }
    }

    .lc-main {
      flex: 1;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .lc-card {
      background: #1c1917;
      border-radius: 10px;
      padding: 24px 22px;
      border: 1px solid #292524;
    }
    .lc-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .lc-card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fafaf9;
      letter-spacing: -0.03em;
    }
    .lc-clear-btn {
      padding: 5px 14px;
      border: 1px solid #44403c;
      border-radius: 6px;
      background: #292524;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #a8a29e;
      font-family: inherit;
      transition: background 0.1s;
    }
    .lc-clear-btn:hover { background: #44403c; }

    .lc-formula {
      margin: 0 0 20px 0;
      font-size: 12px;
      color: #57534e;
      font-family: "Geist Mono", "SF Mono", ui-monospace, monospace;
      font-weight: 400;
    }

    .lc-input-row { margin-bottom: 16px; }
    .lc-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #a8a29e;
      margin-bottom: 5px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .lc-input-group { display: flex; gap: 8px; }
    .lc-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #44403c;
      border-radius: 8px;
      font-size: 16px;
      font-family: "Geist Mono", "SF Mono", ui-monospace, monospace;
      font-weight: 500;
      color: #fafaf9;
      background: #0c0a09;
      outline: none;
      transition: border-color 0.12s;
      min-width: 0;
    }
    .lc-input:focus { border-color: #22c55e; }
    .lc-input::placeholder { color: #44403c; }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .lc-select {
      padding: 10px 8px;
      border: 1.5px solid #44403c;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      color: #fafaf9;
      background: #0c0a09;
      cursor: pointer;
      width: 104px;
      flex: none;
      outline: none;
      transition: border-color 0.12s;
    }
    .lc-select:focus { border-color: #22c55e; }

    .lc-unit-fixed {
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: #a8a29e;
      background: #292524;
      border: 1.5px solid #44403c;
      border-radius: 8px;
      white-space: nowrap;
    }

    .lc-result {
      margin-top: 20px;
      padding: 13px 16px;
      background: rgba(34, 197, 94, 0.08);
      border-radius: 8px;
      border-left: 3px solid #22c55e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .lc-result-label {
      font-size: 11.5px;
      font-weight: 600;
      color: #a8a29e;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .lc-result-value {
      font-size: 16px;
      font-weight: 600;
      font-family: "Geist Mono", "SF Mono", ui-monospace, monospace;
      color: #4ade80;
    }

    .lc-error {
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(220, 38, 38, 0.1);
      border-radius: 8px;
      border-left: 3px solid #dc2626;
      font-size: 13px;
      color: #fca5a5;
      font-weight: 500;
    }

    .lc-toggle-group {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid #44403c;
      width: fit-content;
    }
    .lc-toggle-active {
      padding: 8px 22px;
      border: none;
      background: #22c55e;
      color: #052e16;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .lc-toggle-inactive {
      padding: 8px 22px;
      border: none;
      background: #1c1917;
      color: #78716c;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .lc-toggle-inactive:hover { background: #292524; }

    .lc-footer {
      padding: 16px 20px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 11px;
      color: #44403c;
      border-top: 1px solid #292524;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
  <script src="calc.js"></script>
  <script type="text/babel" data-type="module">
    const { useState } = React;
    const { UNITS, format, massFromMolarity, dilution, reconstituteMolar, reconstituteMassVol, percentWV } = LabCalc;
    const VERSION = "v2 · 2026-11-16";

    function stored(key, fallback) {
      try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
    }
    function store(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { /* private mode: not remembered */ }
    }

    // Reusable components
    function InputRow({ label, value, onChange, unit, units, onUnitChange, placeholder }) {
      return (
        <div className="lc-input-row">
          <label className="lc-label">{label}</label>
          <div className="lc-input-group">
            <input type="number" inputMode="decimal" value={value} onChange={(e) => onChange(e.target.value)}
              placeholder={placeholder || "0"} className="lc-input" step="any" />
            {units ? (
              <select value={unit} onChange={(e) => onUnitChange(e.target.value)} className="lc-select">
                {units.map((u) => <option key={u.label} value={u.label}>{u.label}</option>)}
              </select>
            ) : (
              <span className="lc-unit-fixed">{unit}</span>
            )}
          </div>
        </div>
      );
    }

    function ResultBox({ label, value }) {
      return (
        <div className="lc-result">
          <span className="lc-result-label">{label}</span>
          <span className="lc-result-value">{value || "—"}</span>
        </div>
      );
    }

    function CalcCard({ title, children, onClear }) {
      return (
        <div className="lc-card">
          <div className="lc-card-header">
            <h2 className="lc-card-title">{title}</h2>
            <button onClick={onClear} className="lc-clear-btn">Clear</button>
          </div>
          {children}
        </div>
      );
    }

    function Toggle({ label, options, value, onChange }) {
      return (
        <div className="lc-input-row">
          <label className="lc-label">{label}</label>
          <div className="lc-toggle-group">
            {options.map((o) => (
              <button key={o.id} className={value === o.id ? "lc-toggle-active" : "lc-toggle-inactive"}
                onClick={() => onChange(o.id)}>{o.label}</button>
            ))}
          </div>
        </div>
      );
    }
    const CONC_MODES = [{ id: "molar", label: "Molar" }, { id: "massVol", label: "Mass/Vol" }];

    // Mass from Molarity
    function MassFromMolarity() {
      const [conc, setConc] = useState("");
      const [concUnit, setConcUnit] = useState("mM");
      const [mw, setMw] = useState("");
      const [vol, setVol] = useState("");
      const [volUnit, setVolUnit] = useState("mL");
      const g = massFromMolarity(conc, concUnit, mw, vol, volUnit);
      return (
        <CalcCard title="Mass from Molarity" onClear={() => { setConc(""); setMw(""); setVol(""); }}>
          <p className="lc-formula">mass = concentration × MW × volume</p>
          <InputRow label="Concentration" value={conc} onChange={setConc} unit={concUnit} units={UNITS.molar} onUnitChange={setConcUnit} />
          <InputRow label="Molecular Weight" value={mw} onChange={setMw} unit="g/mol" />
          <InputRow label="Volume" value={vol} onChange={setVol} unit={volUnit} units={UNITS.vol} onUnitChange={setVolUnit} />
          <ResultBox label="Required Mass" value={g === null ? null : format(g, UNITS.mass)} />
        </CalcCard>
      );
    }

    // One dilution form; the Dilution card holds a molar one and a mass/volume one and shows one at a time,
    // so swapping back and forth keeps what was typed in each.
    function DilutionForm({ kind, stockDefault, desiredDefault, clearKey }) {
      const [c1, setC1] = useState("");
      const [c1Unit, setC1Unit] = useState(stockDefault);
      const [c2, setC2] = useState("");
      const [c2Unit, setC2Unit] = useState(desiredDefault);
      const [v2, setV2] = useState("");
      const [v2Unit, setV2Unit] = useState("mL");
      const [lastClear, setLastClear] = useState(clearKey);
      if (clearKey !== lastClear) { setLastClear(clearKey); setC1(""); setC2(""); setV2(""); }
      const r = dilution(kind, c1, c1Unit, c2, c2Unit, v2, v2Unit);
      return (
        <>
          <InputRow label="Stock Concentration (C1)" value={c1} onChange={setC1} unit={c1Unit} units={UNITS[kind]} onUnitChange={setC1Unit} />
          <InputRow label="Desired Concentration (C2)" value={c2} onChange={setC2} unit={c2Unit} units={UNITS[kind]} onUnitChange={setC2Unit} />
          <InputRow label="Desired Final Volume (V2)" value={v2} onChange={setV2} unit={v2Unit} units={UNITS.vol} onUnitChange={setV2Unit} />
          {r && r.error ? <div className="lc-error">{r.error}</div> : (
            <>
              <ResultBox label="Volume of Stock (V1)" value={r && format(r.stock, UNITS.vol)} />
              <ResultBox label="Volume of Diluent" value={r && format(r.diluent, UNITS.vol)} />
            </>
          )}
        </>
      );
    }

    function Dilution() {
      const [mode, setModeState] = useState(() => stored("lc-dilution-mode", "molar"));
      const [clearKey, setClearKey] = useState(0);
      const setMode = (m) => { setModeState(m); store("lc-dilution-mode", m); };
      return (
        <CalcCard title="Dilution (C1V1 = C2V2)" onClear={() => setClearKey((k) => k + 1)}>
          <p className="lc-formula">V1 = (C2 × V2) / C1</p>
          <Toggle label="Concentration Type" options={CONC_MODES} value={mode} onChange={setMode} />
          <div hidden={mode !== "molar"}>
            <DilutionForm kind="molar" stockDefault="mM" desiredDefault={"µM"} clearKey={clearKey} />
          </div>
          <div hidden={mode !== "massVol"}>
            <DilutionForm kind="massVol" stockDefault="mg/mL" desiredDefault={"µg/mL"} clearKey={clearKey} />
          </div>
        </CalcCard>
      );
    }

    // Reconstitution
    function Reconstitution() {
      const [mass, setMass] = useState("");
      const [massUnit, setMassUnit] = useState("mg");
      const [mw, setMw] = useState("");
      const [desiredConc, setDesiredConc] = useState("");
      const [concUnit, setConcUnit] = useState("mM");
      const [concMode, setConcMode] = useState("molar");
      const [massVolUnit, setMassVolUnit] = useState("mg/mL");
      const molar = concMode === "molar";
      const litres = molar
        ? reconstituteMolar(mass, massUnit, mw, desiredConc, concUnit)
        : reconstituteMassVol(mass, massUnit, desiredConc, massVolUnit);
      return (
        <CalcCard title="Reconstitution" onClear={() => { setMass(""); setMw(""); setDesiredConc(""); }}>
          <p className="lc-formula">{molar ? "volume = mass / (concentration × MW)" : "volume = mass / concentration"}</p>
          <InputRow label="Mass of Compound" value={mass} onChange={setMass} unit={massUnit} units={UNITS.mass} onUnitChange={setMassUnit} />
          <Toggle label="Concentration Type" options={CONC_MODES} value={concMode} onChange={setConcMode} />
          {molar && <InputRow label="Molecular Weight" value={mw} onChange={setMw} unit="g/mol" />}
          <InputRow label="Desired Concentration" value={desiredConc} onChange={setDesiredConc}
            unit={molar ? concUnit : massVolUnit}
            units={molar ? UNITS.molar : UNITS.massVol}
            onUnitChange={molar ? setConcUnit : setMassVolUnit} />
          <ResultBox label="Volume of Solvent" value={litres === null ? null : format(litres, UNITS.vol)} />
        </CalcCard>
      );
    }

    // % w/v
    function PercentWV() {
      const [pct, setPct] = useState("");
      const [vol, setVol] = useState("");
      const [volUnit, setVolUnit] = useState("mL");
      const g = percentWV(pct, vol, volUnit);
      return (
        <CalcCard title="% w/v Solution" onClear={() => { setPct(""); setVol(""); }}>
          <p className="lc-formula">mass (g) = (% / 100) × volume (mL)</p>
          <InputRow label="Desired % (w/v)" value={pct} onChange={setPct} unit="%" />
          <InputRow label="Solution Volume" value={vol} onChange={setVol} unit={volUnit} units={UNITS.vol} onUnitChange={setVolUnit} />
          <ResultBox label="Required Mass" value={g === null ? null : format(g, UNITS.mass)} />
        </CalcCard>
      );
    }

    // App
    const TABS = [
      { id: "mass", label: "Mass from Molarity", short: "Mass" },
      { id: "dilution", label: "Dilution", short: "Dilution" },
      { id: "reconst", label: "Reconstitution", short: "Reconst." },
      { id: "pctWV", label: "% w/v", short: "% w/v" },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("mass");
      return (
        <div className="lc-app">
          <header className="lc-header">
            <div className="lc-header-inner">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 3v11"/><path d="M15 3v11"/><path d="M6 14h12"/>
                <path d="M6 14c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2"/>
                <path d="M18 14c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2"/>
                <circle cx="9" cy="3" r="1"/><circle cx="15" cy="3" r="1"/>
              </svg>
              <h1 className="lc-header-title">LabCalc</h1>
            </div>
          </header>
          <nav className="lc-nav">
            {TABS.map((t) => (
              <button key={t.id} onClick={() => setActiveTab(t.id)}
                className={activeTab === t.id ? "lc-tab lc-tab-active" : "lc-tab"}>
                <span className="lc-tab-full">{t.label}</span>
                <span className="lc-tab-short">{t.short}</span>
              </button>
            ))}
          </nav>
          <main className="lc-main">
            {activeTab === "mass" && <MassFromMolarity />}
            {activeTab === "dilution" && <Dilution />}
            {activeTab === "reconst" && <Reconstitution />}
            {activeTab === "pctWV" && <PercentWV />}
          </main>
          <footer className="lc-footer">
            All calculations performed client-side. Verify critical values independently. {VERSION}
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
